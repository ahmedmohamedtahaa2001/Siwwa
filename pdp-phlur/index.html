<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Title, description, canonical, hreflang and the product JSON-LD are
     rewritten by render.js from config.seo + the catalogue on every locale
     switch — see CLAUDE.md "Bilingual by default". -->
<title>Siwa Fragrances | Egyptian Luxury Perfumes</title>
<meta name="description" content="Egyptian perfumery from the Siwa Oasis. Free shipping over 1,500 EGP.">
<link rel="canonical" href="https://siwafragrances.com/products/">
<link rel="alternate" hreflang="en" href="https://siwafragrances.com/products/">
<link rel="alternate" hreflang="ar" href="https://siwafragrances.com/products/?locale=ar">
<link rel="alternate" hreflang="x-default" href="https://siwafragrances.com/products/">
<meta name="theme-color" content="#212012">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23212012'/><text x='16' y='23' font-size='18' text-anchor='middle' fill='%23b18044' font-family='serif'>S</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- The design system is consumed verbatim and never forked. Only
     page-level composition and rhythm live in css/pdp.css. -->
<link rel="stylesheet" href="../component-library/css/tokens.css">
<link rel="stylesheet" href="../component-library/css/components.css">
<link rel="stylesheet" href="css/pdp.css">

<!-- Above-the-fold reservation: the header stack and the hero media have
     known heights, so reserving them here avoids a layout shift on paint. -->
<style>
  body { margin: 0; background: #f7f5ee; }
  .pdp-ann { min-height: 36px; }
  .pdp-hdr { min-height: 56px; }
  .pdp-hero__media { min-height: 560px; }
  @media (max-width: 989px) {
    .pdp-hdr { min-height: 48px; }
    .pdp-hero__media { min-height: 380px; }
  }
</style>

<script type="application/ld+json" id="ldProduct"></script>
<script type="application/ld+json" id="ldBreadcrumbs"></script>
</head>

<body class="pdp-page" id="top">

<a class="skiplink" href="#main">Skip to content</a>

<!-- Structural clone of the phlur.com product detail page, captured
     2026-08-13 from Wayback snapshots of four product pages. The band
     order below is Phlur's, identical on all four captures; the colour,
     type, imagery and copy are Siwa's.
     Evidence: ../reference-phlur/pdp/PHLUR-PDP-SPEC.md -->

<!-- 1 · ANNOUNCEMENT — 36px strip ---------------------------- -->
<div id="sec-announcement"></div>

<!-- 2 · HEADER — 56px sticky --------------------------------- -->
<div id="sec-header"></div>

<main id="main">

  <!-- 3 · BREADCRUMBS — dedicated band above the hero -------- -->
  <div id="sec-breadcrumbs"></div>

  <!-- 4 · HERO — 50/50 gallery + sticky buy box -------------- -->
  <div id="sec-hero"></div>

  <!-- 5 · SCENT NOTES — tiers beside an oversized image ------ -->
  <div id="sec-scent-notes"></div>

  <!-- 6 · INTENSITY & SILLAGE — Siwa addition (B-03) --------- -->
  <div id="sec-scales"></div>

  <!-- 7 · THE COLLECTION — sibling rail ---------------------- -->
  <div id="sec-collection"></div>

  <!-- 8 · QUOTE — 1/3 statement, 2/3 image ------------------- -->
  <div id="sec-quote"></div>

  <!-- 9 · REVIEWS — summary + distribution + list ------------ -->
  <div id="sec-reviews"></div>

  <!-- 10 · YOU MAY ALSO LIKE -------------------------------- -->
  <div id="sec-recommendations"></div>

</main>

<!-- 11 · STICKY CTA — revealed once the buy box scrolls away - -->
<div id="sec-sticky-cta"></div>

<!-- 12 · FOOTER ------------------------------------------- -->
<div id="sec-footer"></div>

<!-- Overlays -->
<div id="overlayHost"></div>
<!-- library.js's toast() no-ops without this host; the homepage build
     omitted it, so toasts were silently dropped there. -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sr-only" id="liveRegion" role="status" aria-live="polite" aria-atomic="true"></div>

<script>window.SIWA_IMG_BASE = '../component-library/img/';</script>
<script src="../component-library/js/data.js"></script>
<script src="../component-library/js/library.js"></script>
<script src="js/config.js"></script>
<script src="js/render.js"></script>
</body>
</html>
