# Siwa theme — theme-check configuration.
#
# The default rule set is on. The three exceptions below are deliberate and each
# carries its reason; nothing else is disabled. A new offense is a build failure,
# not a warning to live with.

extends: :default

RemoteAsset:
  enabled: false
  # Reason: the five design directions each name their own Latin + Arabic type
  # pair, and all ten families load from Google Fonts in layout/theme.liquid so
  # that switching direction or locale never waits on a font request. Shopify
  # Fonts does not carry Aref Ruqaa, Amiri, Noto Kufi Arabic, Baloo Bhaijaan 2,
  # Archivo Black or Cormorant Garamond. Revisit if the faces get self-hosted —
  # see DEVIATIONS.md.

# Left on deliberately: a section referenced by the layout or a template but not
# yet written is a real error, and the count of them is the Gate 1 to-do list.
MissingTemplate:
  enabled: true

TranslationKeyExists:
  enabled: true

# Liquid files that are not templates in the usual sense.
ignore:
  - node_modules/
  - .git/
